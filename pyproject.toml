[project]
name = "pressfreedomtracker.us"
# Bounded to the minor version of PYTHON_IMAGE in ci/containers/Containerfile.
requires-python = ">=3.14,<3.15"
dependencies = [
    "beautifulsoup4",
    "Django>=5.2.19,<6.0",
    "djangorestframework>=3.18.2",
    "django-anymail",
    "django-csp>=3.7",
    "django-modelcluster>=6.2.1",
    "django-storages[google]>=1.14.6",
    "django-webpack-loader",
    "django-widget-tweaks",
    "djangorestframework-csv",
    "docutils",
    "drf-spectacular[sidecar]>=0.30.0",
    "factory_boy>=3.3.3",
    "gunicorn",
    "Jinja2>=3.1.6",
    "lxml>=6.1.3",
    "mailchimp_marketing>=3.0.66",
    "marshmallow>=4.3.1,<5",
    "nh3>=0.3.7",
    "pillow>=12.3.0",
    "psycopg[binary]",
    "Pygments>=2.21.0",
    "requests>=2.34.2",
    "structlog",
    "typogrify",
    "unittest-xml-reporting",
    "wagtail-autocomplete>=0.12.1",
    "wagtail-django-recaptcha",
    "wagtail-factories>=4.5.0",
    "wagtail-honeypot",
    "wagtail-inventory>=3.4",
    "wagtail-metadata>=5.0.0",
    "wagtail-newsletter[mailchimp,mrml]",
    "wagtail>=7.4.3,<8.0",
    "whitenoise",
    # fpf-wagtail-common builds wheel files and attaches them as assets on new releases.
    # See https://github.com/freedomofpress/fpf-wagtail-common/releases
    "fpf-wagtail-common @ https://github.com/freedomofpress/fpf-wagtail-common/releases/download/v0.3.0/fpf_wagtail_common-0.3.0-py3-none-any.whl",
    "google-api-python-client",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
# Developer tooling, for testing and linting
dev = [
    "bandit",
    "colorama<1",
    "coverage>=7.16.2",
    "defusedxml",
    "diff-cover>=10.6.0",
    "django-debug-toolbar>=8.0.0",
    "django-silk>=5.6.0",
    "ipdb>=0.13.9",
    "pyinstrument>=5.1.3",
    "ruff",
    "selenium",
]

[tool.poetry]
# We use pyproject to manage deps, not to organize an installable package.
package-mode = false

# Poetry itself, hash-pinned for the Containerfile's `poetry` stage. A Poetry
# group, not [dependency-groups]: Dependabot reports exact pins there as
# "update_not_possible" and never bumps them (dependabot CLI v1.93.0).
[tool.poetry.group.bootstrap.dependencies]
poetry = "2.5.1"
poetry-plugin-export = "1.10.1"

[tool.ruff]
exclude = [
    "node_modules",
]

# exclude RUF012 because it results in a lot of false positives in Django code,
# especially in migrations
[tool.ruff.lint]
ignore = ["E501", "E266", "RUF012"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["blog", "charts", "cloudflare", "common", "dashboard", "emails", "forms", "geonames", "home", "incident", "menus", "statistics", "styleguide"]
section-order = [
    # the default, plus our Django and Wagtail sections
    "future",
    "standard-library",
    "django",
    "wagtail",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"wagtail" = ["wagtail"]

[tool.pre-commit-update.yaml]
mapping = 2
sequence = 4
offset = 2
