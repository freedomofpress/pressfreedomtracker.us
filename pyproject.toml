[project]
name = "pressfreedomtracker.us"
requires-python = ">=3.14"

[tool.ruff]
exclude = [
    "node_modules",
]

# exclude RUF012 because it results in a lot of false positives in Django code,
# especially in migrations
[tool.ruff.lint]
ignore = ["E501", "E266", "RUF012"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["blog", "charts", "cloudflare", "common", "dashboard", "emails", "forms", "geonames", "home", "incident", "menus", "statistics", "styleguide"]
section-order = [
    # the default, plus our Django and Wagtail sections
    "future",
    "standard-library",
    "django",
    "wagtail",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"wagtail" = ["wagtail"]

[tool.pre-commit-update.yaml]
mapping = 2
sequence = 4
offset = 2
