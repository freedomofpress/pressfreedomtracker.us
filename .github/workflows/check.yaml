---
name: CI

on:
  pull_request:
    types: ['opened', 'synchronize']
  push:
    branches: ['prod', 'develop']
  merge_group:

env:
  CONTAINER_ENGINE: docker
  VERSION_DOCKER: v29.6.2
  COMPOSE_FILE_DEV: docker-compose.yaml
  COMPOSE_FILE_PROD: prod-docker-compose.yaml
  # Must match PYTHON_IMAGE in ci/containers/Containerfile
  VERSION_PYTHON: 3.14.6

permissions:
  contents: read
  actions: read

jobs:
  lint-actions:
    name: Lint:Actions
    uses: freedomofpress/actionslib/.github/workflows/lint-actions.yaml@main

  build-dev-django:
    name: Build:Dev:Django
    uses: freedomofpress/actionslib/.github/workflows/oci-build.yaml@main
    with:
      context: '.'
      containerfile: ci/containers/Containerfile
      target: dev
      # All five build jobs share one Containerfile, so hadolint only needs to
      # run in one of them. Honours .hadolint.yaml at the repo root.
      lint: true
      build-args: |
        USERID=1001
      registry: localhost/pressfreedomtracker-us-dev-django

  build-dev-node:
    name: Build:Dev:Node
    uses: freedomofpress/actionslib/.github/workflows/oci-build.yaml@main
    with:
      context: '.'
      containerfile: ci/containers/Containerfile
      target: node-dev
      build-args: |
        USERID=1001
      registry: localhost/pressfreedomtracker-us-dev-node

  build-dev-chartgen:
    name: Build:Dev:Chartgen
    uses: freedomofpress/actionslib/.github/workflows/oci-build.yaml@main
    with:
      context: '.'
      containerfile: ci/containers/Containerfile
      target: chartgen-dev
      build-args: |
        USERID=1001
      registry: localhost/pressfreedomtracker-us-dev-chartgen

  build-prod-django:
    name: Build:Prod:Django
    uses: freedomofpress/actionslib/.github/workflows/oci-build.yaml@main
    with:
      context: '.'
      containerfile: ci/containers/Containerfile
      target: prod
      # No USERID override: the Containerfile defaults to 1000, matching both
      # publish.yaml and the k8s securityContext, so the image tested here is
      # the same artifact that gets deployed.
      registry: localhost/pressfreedomtracker-us
      requires-deep-history: true

  build-prod-chartgen:
    name: Build:Prod:Chartgen
    uses: freedomofpress/actionslib/.github/workflows/oci-build.yaml@main
    with:
      context: '.'
      containerfile: ci/containers/Containerfile
      target: chartgen
      # Likewise: the chartgen stages default to 1001, the uid publish.yaml ships.
      registry: localhost/pressfreedomtracker-us-chartgen

  lint-lockfiles:
    # Standalone, with no `needs`, so it runs alongside the image builds rather
    # than waiting on them: it uses a throwaway pip-tools container, not the dev
    # image. The dev image installs the checked-in dev-requirements.txt, so
    # nothing else in CI would notice the lockfiles drifting from the .in files.
    name: Lint:Lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: just

      - name: Recompile lockfiles and fail on drift
        run: just pip-check

  test:
    # This job name is also the branch-protection check name, so it is decoupled
    # from the just recipe: `name` pins the published check where a recipe has
    # since been renamed, defaulting to the recipe name otherwise. Renaming a
    # pinned check means updating the repo's required checks in the same breath.
    name: Test:${{ matrix.name || matrix.target }}
    runs-on: ubuntu-latest
    needs:
      - build-dev-django
      - build-dev-node
      - build-dev-chartgen
    strategy:
      # A failing linter shouldn't cancel the Django suite's feedback.
      fail-fast: false
      matrix:
        include:
          # These run in a one-shot container via `compose run --no-deps`, so
          # they need no service stack and the compose-up below is skipped.
          - target: check-migrations
            stack: false
          - target: bandit
            stack: false
          - target: ruff
            stack: false
          - target: eslint
            stack: false
          - target: stylelint
            stack: false
          - target: test-js
            name: dev-jest-tests
            stack: false
          # The Django suite needs live postgres, selenium, the built asset
          # bundles and the chart pregenerator.
          - target: test
            name: dev-tests
            stack: true
    steps:
      - name: Install Docker
        uses: docker/setup-docker-action@v5.4.0
        with:
          version: ${{ env.VERSION_DOCKER }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download dev django image
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-dev-django.outputs.artifact-name }}
          path: ${{ runner.temp }}/images

      - name: Download dev node image
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-dev-node.outputs.artifact-name }}
          path: ${{ runner.temp }}/images

      - name: Download dev chartgen image
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-dev-chartgen.outputs.artifact-name }}
          path: ${{ runner.temp }}/images

      - name: Restore dev images
        env:
          DJANGO_LOAD_FILE: ${{ runner.temp }}/images/${{ needs.build-dev-django.outputs.artifact-image }}
          DJANGO_IMAGE_URL: ${{ needs.build-dev-django.outputs.image-url }}
          NODE_LOAD_FILE: ${{ runner.temp }}/images/${{ needs.build-dev-node.outputs.artifact-image }}
          NODE_IMAGE_URL: ${{ needs.build-dev-node.outputs.image-url }}
          CHARTGEN_LOAD_FILE: ${{ runner.temp }}/images/${{ needs.build-dev-chartgen.outputs.artifact-image }}
          CHARTGEN_IMAGE_URL: ${{ needs.build-dev-chartgen.outputs.image-url }}
        run: |
          docker image load --input "$DJANGO_LOAD_FILE"
          docker image load --input "$NODE_LOAD_FILE"
          docker image load --input "$CHARTGEN_LOAD_FILE"

          # These tags need to match whatever is specified in the dev compose file
          docker image tag "$DJANGO_IMAGE_URL" localhost/pressfreedomtracker-us-django
          docker image tag "$NODE_IMAGE_URL" localhost/pressfreedomtracker-us-node
          docker image tag "$CHARTGEN_IMAGE_URL" localhost/pressfreedomtracker-us-node-chart-pregenerator

      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Create env config
        run: just dev-init

      # --no-build asserts the images restored above are the ones under test:
      # compose errors out if a tag is missing rather than silently rebuilding
      # from source, which would mask a broken artifact hand-off.
      - name: Start
        if: ${{ matrix.stack }}
        run: docker compose --file="$COMPOSE_FILE_DEV" up --wait --wait-timeout=180 --detach --pull=missing --no-build

      - name: Run target '${{ matrix.target }}'
        run: just ${{ matrix.target }}

      - name: Collect logs on failure
        if: ${{ failure() && matrix.stack }}
        run: |
          docker compose --file="$COMPOSE_FILE_DEV" logs django
          docker compose --file="$COMPOSE_FILE_DEV" logs node-chart-pregenerator
          docker compose --file="$COMPOSE_FILE_DEV" logs node

      - name: Save HTML coverage
        uses: actions/upload-artifact@v7
        if: ${{ matrix.target == 'test' }}
        with:
          name: test-${{ matrix.name }}-${{ github.run_id }}-htmlcov
          path: htmlcov
          if-no-files-found: error
          overwrite: true
          retention-days: 5

      - name: Save PyTest coverage
        uses: actions/upload-artifact@v7
        if: ${{ matrix.target == 'test' }}
        with:
          name: test-${{ matrix.name }}-${{ github.run_id }}-pytestcov
          path: coverage.xml
          if-no-files-found: error
          overwrite: true
          retention-days: 5

    outputs:
      artifact-pytestcov: test-dev-tests-${{ github.run_id }}-pytestcov

  test-coverage:
    name: Test:coverage
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install Python ${{ env.VERSION_PYTHON }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.VERSION_PYTHON }}

      - name: Configure Job Cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-py${{ env.VERSION_PYTHON }}-${{ hashFiles('./ci-requirements.txt') }}

      - name: Install requirements
        run: |
          python -m pip install --requirement=ci-requirements.txt --require-hashes --disable-pip-version-check --no-color --no-input

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test.outputs.artifact-pytestcov }}
          path: ${{ runner.temp }}/coverage

      - name: Compare coverage
        run: |
          diff-cover ${{ runner.temp }}/coverage/coverage.xml --compare-branch=origin/develop --fail-under=100

  test-prod:
    name: Test:production
    runs-on: ubuntu-latest
    needs:
      - build-prod-django
      - build-prod-chartgen
    steps:
      - name: Install Docker
        uses: docker/setup-docker-action@v5.4.0
        with:
          version: ${{ env.VERSION_DOCKER }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download django image
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-prod-django.outputs.artifact-name }}
          path: ${{ runner.temp }}/images

      - name: Download chartgen image
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-prod-chartgen.outputs.artifact-name }}
          path: ${{ runner.temp }}/images

      - name: Restore prod image
        env:
          DJANGO_LOAD_FILE: ${{ runner.temp }}/images/${{ needs.build-prod-django.outputs.artifact-image }}
          DJANGO_IMAGE_URL: ${{ needs.build-prod-django.outputs.image-url }}
          CHARTGEN_LOAD_FILE: ${{ runner.temp }}/images/${{ needs.build-prod-chartgen.outputs.artifact-image }}
          CHARTGEN_IMAGE_URL: ${{ needs.build-prod-chartgen.outputs.image-url }}
        run: |
          docker image load --input "$DJANGO_LOAD_FILE"
          docker image load --input "$CHARTGEN_LOAD_FILE"

          # This tag needs to match whatever is in the prod compose file
          docker image tag "$DJANGO_IMAGE_URL" ghcr.io/freedomofpress/pressfreedomtracker-us
          docker image tag "$CHARTGEN_IMAGE_URL" ghcr.io/freedomofpress/pressfreedomtracker-us-chartgen

      - name: Start
        run: docker compose --file="$COMPOSE_FILE_PROD" up --wait --wait-timeout=180 --detach --pull=missing --no-build

      - name: Verify database
        run: |
          docker compose --file="$COMPOSE_FILE_PROD" exec django \
          /bin/bash -c "./manage.py createdevdata --no-download"

      # Against the published port, from outside the container: the artifact
      # under test is not modified to test it.
      - name: Verify site skeleton
        run: curl --fail --silent --show-error http://localhost:8000/ | grep -q 'Press Freedom Tracker'

      - name: Collect logs on failure
        if: ${{ failure() }}
        run: |
          docker compose --file="$COMPOSE_FILE_PROD" logs django
          docker compose --file="$COMPOSE_FILE_PROD" logs node-chart-pregenerator

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs:
      - build-dev-django
      - build-dev-node
      - build-dev-chartgen
      - build-prod-django
      - build-prod-chartgen
      - test
      - test-prod
    if: ${{ always() }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete dev django image
        if: ${{ needs.build-dev-django.result == 'success' && always() }}
        uses: freedomofpress/actionslib/act/delete-artifact@main
        with:
          artifact: ${{ needs.build-dev-django.outputs.artifact-name }}
          error-if-absent: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete dev node image
        if: ${{ needs.build-dev-node.result == 'success' && always() }}
        uses: freedomofpress/actionslib/act/delete-artifact@main
        with:
          artifact: ${{ needs.build-dev-node.outputs.artifact-name }}
          error-if-absent: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete dev chartgen image
        if: ${{ needs.build-dev-chartgen.result == 'success' && always() }}
        uses: freedomofpress/actionslib/act/delete-artifact@main
        with:
          artifact: ${{ needs.build-dev-chartgen.outputs.artifact-name }}
          error-if-absent: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete prod django image
        if: ${{ needs.build-prod-django.result == 'success' && always() }}
        uses: freedomofpress/actionslib/act/delete-artifact@main
        with:
          artifact: ${{ needs.build-prod-django.outputs.artifact-name }}
          error-if-absent: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete prod chartgen image
        if: ${{ needs.build-prod-chartgen.result == 'success' && always() }}
        uses: freedomofpress/actionslib/act/delete-artifact@main
        with:
          artifact: ${{ needs.build-prod-chartgen.outputs.artifact-name }}
          error-if-absent: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
