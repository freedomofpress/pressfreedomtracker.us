---
networks:
  app:

x-variables:
  db-name: &db-name trackerdb
  db-username: &db-username tracker
  db-password: &db-password trackerpassword

x-chart-pregenerator:
  host: &chart-host ${NODE_CHART_PREGENERATOR_HOST:-chartgenerator}
  port: &chart-port ${NODE_CHART_PREGENERATOR_PORT:-3000}

services:
  postgresql:
    image: docker.io/library/postgres:17
    init: true
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./:/django:ro,z
    environment:
      POSTGRES_PASSWORD: *db-password
      POSTGRES_USER: *db-username
      POSTGRES_DB: *db-name
    user: postgres
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-q',
          '-h',
          'localhost',
          '-U',
          *db-username,
          '--dbname',
          *db-name,
        ]
      timeout: 45s
      interval: 10s
      retries: 10
    networks:
      app:
        aliases:
          - db

  selenium:
    image: docker.io/selenium/standalone-firefox-debug:latest
    init: true
    ports:
      - '127.0.0.1::5900'
    networks:
      app:
        aliases:
          - selenium

  node:
    image: localhost/pressfreedomtracker-us-node
    build:
      context: .
      dockerfile: ci/containers/Containerfile
      target: node-dev
      args:
        USERID: ${UID:?err}
    init: true
    volumes:
      - ./:/django:z
    working_dir: /django
    user: ${UID:?err}
    healthcheck:
      test: jq '.status' build/static/bundles/webpack-stats.json |grep -q -e compiling -e error -e done
      interval: 10s
      start_period: 1m30s
    userns_mode: keep-id
    networks:
      - app

  node-chart-pregenerator:
    image: localhost/pressfreedomtracker-us-node-chart-pregenerator
    build:
      context: .
      dockerfile: ci/containers/Containerfile
      target: chartgen-dev
      args:
        USERID: ${UID:?err}
    init: true
    volumes:
      - ./:/django:z
      - ./client:/app/client:z
      - ./chart_pregenerator/src:/app/src:z
    environment:
      DEPLOY_ENV: dev
      DJANGO_HOST: app
      DJANGO_PORT: 8000
      PORT: *chart-port
    ports:
      - target: *chart-port
        published: *chart-port
    user: ${UID:?err}
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:3000/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    userns_mode: keep-id
    networks:
      app:
        aliases:
          - *chart-host

  django:
    init: true
    stdin_open: true
    tty: true
    image: localhost/pressfreedomtracker-us-django
    build:
      context: .
      dockerfile: ci/containers/Containerfile
      target: dev
      args:
        USERID: ${UID:?err}
    depends_on:
      postgresql:
        condition: service_healthy
      node:
        condition: service_healthy
      node-chart-pregenerator:
        condition: service_healthy
    environment:
      DEPLOY_ENV: dev
      DJANGO_ALLOWED_HOSTS: app localhost
      DJANGO_CHART_HOST: node-chart-pregenerator
      DJANGO_CHART_PORT: *chart-port
      DJANGO_CREATEDEVDATA: '${DJANGO_CREATEDEVDATA:-no}'
      DJANGO_DB_HOST: db
      DJANGO_DB_NAME: *db-name
      DJANGO_DB_PASSWORD: *db-password
      DJANGO_DB_PORT: 5432
      DJANGO_DB_USER: *db-username
      DJANGO_PROFILE: '${DJANGO_PROFILE:-no}'
      DJANGO_XMLTEST_OUTPUT: 'yes'
      MAILCHIMP_API_KEY:
      NEWSLETTER_FROM_NAME:
      NEWSLETTER_REPLY_TO:
      PREPUB_DOCUMENT_ID:
      PREPUB_GOOGLE_SHEETS_CREDS:
      PREPUB_HEADER_ROW_INDEX:
      PREPUB_SHEET_NAME:
      PYINSTRUMENT: '${PYINSTRUMENT:-no}'
      SELENIUM_HOST: selenium
    working_dir: /django
    userns_mode: keep-id
    volumes:
      - ./:/django:z
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', 'http://localhost:8000/health/ok/?monitor']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      app:
        aliases:
          - app
