---
networks:
  app:

x-chart-pregenerator:
  host: &chart-host ${NODE_CHART_PREGENERATOR_HOST:-chartgenerator}
  port: &chart-port ${NODE_CHART_PREGENERATOR_PORT:-3000}

services:
  postgresql:
    image: docker.io/library/postgres:17
    init: true
    ports:
      - '127.0.0.1::5432'
    environment:
      POSTGRES_PASSWORD: trackerpassword
      POSTGRES_USER: tracker
      POSTGRES_DB: trackerdb
    user: postgres
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-q',
          '-h',
          'localhost',
          '-U',
          'tracker',
          '--dbname',
          'trackerdb',
        ]
      timeout: 45s
      interval: 10s
      retries: 10
    networks:
      app:
        aliases:
          - db

  django:
    init: true
    build:
      context: .
      dockerfile: ci/containers/Containerfile
      target: prod
      args:
        USERID: 1000
    image: ghcr.io/freedomofpress/pressfreedomtracker-us
    depends_on:
      postgresql:
        condition: service_healthy
    working_dir: /django
    volumes:
      - ${HOST_MEDIA_DIR:-pft-django-media}:/django-media
      - ${HOST_STATIC_DIR:-pft-django-static}:/django-static
    environment:
      DEPLOY_ENV: prod
      DJANGO_ALLOWED_HOSTS: app localhost
      DJANGO_APP_NAME: tracker
      DJANGO_CHART_HOST: node-chart-pregenerator
      DJANGO_CHART_PORT: *chart-port
      DJANGO_COLLECT_STATIC: 'yes'
      DJANGO_CREATEDEVDATA: '${DJANGO_CREATEDEVDATA:-no}'
      DJANGO_DB_HOST: db
      DJANGO_DB_NAME: trackerdb
      DJANGO_DB_PASSWORD: trackerpassword
      DJANGO_DB_PORT: 5432
      DJANGO_DB_USER: tracker
      DJANGO_JSON_LOG: 'yes'
      DJANGO_MEDIA_ROOT: /django-media
      DJANGO_ONION_HOSTNAME: pfts5wyphb5x.onion
      # Arbitrary key for this "prod-like" testing setup. Do not use in real life.
      DJANGO_SECRET_KEY: 64a235ef65834d8b42fa2802dd4290cf61c773c3f31332039ec5c48165f744da
      DJANGO_SETTINGS_MODULE: tracker.settings.production
      DJANGO_SILENCED_SYSTEM_CHECKS: django_recaptcha.recaptcha_test_key_error
      DJANGO_STATIC_ROOT: /django-static
      DJANGO_WHITENOISE: 'yes'
      DJANGO_XMLTEST_OUTPUT: 'yes'
      GOOGLE_SHEETS_CREDS:
      # More fake testing keys (see above); generate your own for deployment.
      RECAPTCHA_PUBLIC_KEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
      RECAPTCHA_PRIVATE_KEY: 6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health/ok/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      app:
        aliases:
          - app
    ports:
      - '127.0.0.1:8000:8000'

  node-chart-pregenerator:
    read_only: true
    init: true
    build:
      context: .
      dockerfile: ci/containers/Containerfile
      target: chartgen
      args:
        USERID: 1001
    image: ghcr.io/freedomofpress/pressfreedomtracker-us-chartgen
    environment:
      DJANGO_HOST: app
      PORT: *chart-port
    ports:
      - target: *chart-port
        published: *chart-port
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:3000/']
      start_period: 10s
      interval: 30s
      timeout: 20s
      retries: 4
    networks:
      app:
        aliases:
          - *chart-host

volumes:
  pft-django-static:
  pft-django-media:
